services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acvs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-env.sh}
      POSTGRES_DB: acvs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acvs"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://acvs:${POSTGRES_PASSWORD}@postgres:5432/acvs
      JWT_SECRET: ${JWT_SECRET:?run scripts/gen-env.sh}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run scripts/gen-env.sh}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      TSA_URL: ${TSA_URL:-}
      TSA_CA_FILE: ${TSA_CA_FILE:-}
      TSA_INTERVAL_SECS: ${TSA_INTERVAL_SECS:-}
      TSA_TIMEOUT_SECS: ${TSA_TIMEOUT_SECS:-}
      TRUST_PROXY: "true"
      RUST_LOG: info
    # The API writes nothing to disk, so it runs unprivileged on a read-only filesystem with no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/tsa:/etc/acvs/tsa:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
