name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/gen-env.sh
      - run: docker compose up -d --build --wait
      - run: ./scripts/smoke.sh http://localhost:3000
      - run: ./scripts/verify-race-test.py
      - run: docker compose down -v
      - run: ./scripts/recovery-test.sh
      - if: failure()
        run: docker compose logs

  e2e-prod:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/gen-env.sh
      - run: ./scripts/prod-test.sh
      - run: MODE=prod ./scripts/personal-sig-test.sh

  e2e-timestamp:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/gen-env.sh
      - run: ./scripts/timestamp-test.sh

  e2e-personal:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/gen-env.sh
      - run: ./scripts/personal-sig-test.sh

  e2e-browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - run: ./scripts/gen-env.sh
      - run: docker compose up -d --build --wait
      - run: npm ci
        working-directory: e2e
      - run: PASS=$(grep '^SEED_DEMO_PASSWORD=' .env | cut -d= -f2) REPO=$PWD node e2e/browser.mjs
      - if: failure()
        run: docker compose logs
