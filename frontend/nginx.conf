server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Optional extra config (the production stack mounts real-ip.conf here). Absent by default.
    include /etc/nginx/acvs/*.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Resolve the backend lazily so nginx starts even if it is briefly down.
    resolver 127.0.0.11 valid=10s;
    # A bulk import carries up to 500 rows.
    location = /api/v1/credentials/bulk {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 1m;
    }

    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 16k;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
